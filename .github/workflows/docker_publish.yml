name: docker_publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - run: make binaries

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: binaries

  ghcr:
    needs: binaries
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: binaries

      - run: make ghcr
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ghcr_transcode:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - run: make ghcr-transcode
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
